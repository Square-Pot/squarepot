# Install once with `pre-commit install`; CI runs the same hooks on every file.
# Component linters (ruff, mypy, eslint, ktlint, ...) are added here as each
# component gets code.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # .gitattributes checks Windows scripts out with CRLF.
        exclude: '\.(bat|cmd)$'
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        # License texts are kept verbatim.
        exclude: (^|/)LICENSE$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: Validate the field schema
        files: ^schema/fields\.yaml$
        args: ["--schemafile", "schema/fields.schema.json"]
      - id: check-metaschema
        files: ^schema/.*\.schema\.json$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Components with dependencies are type-checked in their own CI job.
        files: ^schema/
        args: ["--strict"]
        additional_dependencies: ["types-PyYAML==6.0.12.20260906"]

  - repo: local
    hooks:
      - id: check-fields
        name: Check field schema references
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        entry: python schema/check_fields.py
        files: ^schema/(fields\.yaml|check_fields\.py)$
        pass_filenames: false
      - id: check-fields-self-test
        name: Self-test the field schema checker
        language: python
        additional_dependencies: ["PyYAML==6.0.3"]
        entry: python schema/check_fields.py --self-test
        files: ^schema/(fields\.yaml|check_fields\.py)$
        pass_filenames: false
