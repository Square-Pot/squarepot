name: Android e2e

# The app's sync against the real server in demo mode, so that a change on either side that
# breaks the v1 contract fails here.
on:
  pull_request:
    paths:
      - "android/**"
      - "server/**"
      - "schema/**"
      - "deploy/compose.demo.yaml"
      - ".github/workflows/android-e2e.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "server/**"
      - "schema/**"
      - "deploy/compose.demo.yaml"
      - ".github/workflows/android-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sync:
    name: Sync with the demo server
    runs-on: ubuntu-24.04
    env:
      # Only guards the throwaway demo container in this job; not a secret.
      SQUAREPOT_API_TOKEN: ci-e2e-token-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the demo server
        working-directory: deploy
        run: docker compose -f compose.demo.yaml up --detach --build --wait

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Sync test
        working-directory: android
        env:
          SQUAREPOT_E2E_URL: http://127.0.0.1:8000
          SQUAREPOT_E2E_TOKEN: ${{ env.SQUAREPOT_API_TOKEN }}
          SQUAREPOT_E2E_CSV: ${{ github.workspace }}/server/demo/plants.csv
        run: >-
          ./gradlew --no-daemon testDebugUnitTest
          --tests 'io.github.squarepot.app.data.DemoServerTest'

      # The test skips itself without a demo server; make sure it really ran here.
      - name: Check that the test ran
        working-directory: android/app/build/test-results/testDebugUnitTest
        run: grep -q 'tests="1" skipped="0" failures="0" errors="0"' TEST-io.github.squarepot.app.data.DemoServerTest.xml

      - name: Server log
        if: failure()
        working-directory: deploy
        run: docker compose -f compose.demo.yaml logs
