name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each component adds its own job here (lint, type check, test) as it gets code.

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # The version comes from the pre-commit hook, so Dependabot bumps both at once.
        run: |
          GITLEAKS_VERSION="$(awk '/repo: https:\/\/github.com\/gitleaks\/gitleaks$/ { found = 1; next }
            found && /rev:/ { sub(/^v/, "", $2); print $2; exit }' .pre-commit-config.yaml)"
          test -n "${GITLEAKS_VERSION}"
          echo "gitleaks ${GITLEAKS_VERSION}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan full history
        run: gitleaks git --redact --verbose .

  authors:
    name: Commit authors
    # Pull requests from this repository's own branches; outside contributors work from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit's author and committer
        # The owner's identity, Dependabot, and GitHub itself (web edits, merges, signed bot commits).
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOWED: |-
            596713+spalk@users.noreply.github.com
            49699333+dependabot[bot]@users.noreply.github.com
            noreply@github.com
        run: |
          # Written first, so that a failing git log stops the step instead of checking nothing.
          commits="${RUNNER_TEMP}/commits.tsv"
          git log --format='%h%x09%ae%x09%ce%x09%s' "${BASE}..${HEAD}" > "${commits}"
          test -s "${commits}"
          status=0
          while IFS=$'\t' read -r commit author committer subject; do
            for email in "${author}" "${committer}"; do
              if ! grep --quiet --line-regexp --fixed-strings -- "${email}" <<< "${ALLOWED}"; then
                echo "::error::${commit} ${subject}: ${email} is not an allowed author or committer"
                status=1
              fi
            done
          done < "${commits}"
          if [ "${status}" -ne 0 ]; then
            echo "Set the identity with git config user.email, then rewrite the commits, e.g."
            echo "git rebase --exec 'git commit --amend --no-edit --reset-author' ${BASE}"
          fi
          exit "${status}"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.12"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run hooks
        # gitleaks runs in its own job over the full history.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  server:
    name: Server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --file server/Dockerfile --tag squarepot-server:ci .

      - name: Start and check health
        run: |
          docker run --detach --name server --publish 127.0.0.1:8000:8000 \
            --env SQUAREPOT_API_TOKEN=ci-token-0123456789 squarepot-server:ci
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          docker logs server
          exit 1
