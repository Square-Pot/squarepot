name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each component adds its own job here (lint, type check, test) as it gets code.

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # The version comes from the pre-commit hook, so Dependabot bumps both at once.
        run: |
          GITLEAKS_VERSION="$(awk '/repo: https:\/\/github.com\/gitleaks\/gitleaks$/ { found = 1; next }
            found && /rev:/ { sub(/^v/, "", $2); print $2; exit }' .pre-commit-config.yaml)"
          test -n "${GITLEAKS_VERSION}"
          echo "gitleaks ${GITLEAKS_VERSION}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan full history
        run: gitleaks git --redact --verbose .

  authors:
    name: Commit authors
    # Pull requests from this repository's own branches; outside contributors work from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit's author and committer
        # The owner's identity, Dependabot, and GitHub itself (web edits, merges, signed bot commits).
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOWED: |-
            596713+spalk@users.noreply.github.com
            49699333+dependabot[bot]@users.noreply.github.com
            noreply@github.com
        run: |
          # Written first, so that a failing git log stops the step instead of checking nothing.
          commits="${RUNNER_TEMP}/commits.tsv"
          git log --format='%h%x09%ae%x09%ce%x09%s' "${BASE}..${HEAD}" > "${commits}"
          test -s "${commits}"
          status=0
          while IFS=$'\t' read -r commit author committer subject; do
            for email in "${author}" "${committer}"; do
              if ! grep --quiet --line-regexp --fixed-strings -- "${email}" <<< "${ALLOWED}"; then
                echo "::error::${commit} ${subject}: ${email} is not an allowed author or committer"
                status=1
              fi
            done
          done < "${commits}"
          if [ "${status}" -ne 0 ]; then
            echo "Set the identity with git config user.email, then rewrite the commits, e.g."
            echo "git rebase --exec 'git commit --amend --no-edit --reset-author' ${BASE}"
          fi
          exit "${status}"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository stores text with LF (.gitattributes). A commit made without
      # it, such as Dependabot's Gradle wrapper bumps, can store CRLF, and then every
      # checkout shows the file as modified. The hooks see only the working copy.
      - name: Check line endings in the index
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::Files stored with CRLF; fix with: git add --renormalize <file>"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run hooks
        # gitleaks runs in its own job over the full history.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  server:
    name: Server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the API client
        run: npm run gen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build --file server/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag squarepot-server:ci .

      - name: Start and check health
        run: |
          docker run --detach --name server --publish 127.0.0.1:8000:8000 \
            --env SQUAREPOT_API_TOKEN=ci-token-0123456789 squarepot-server:ci
          for _ in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/v1/health || { docker logs server; exit 1; }

      - name: Check that the web app is served
        run: |
          # The app's own addresses get its page; its scripts come from assets/.
          curl --fail --silent --show-error "http://127.0.0.1:8000/c/main?genus=Lithops" | tee index.html
          grep --quiet '<div id="root"></div>' index.html
          script="$(grep --only-matching '/assets/[^"]*\.js' index.html | head -n 1)"
          test -n "${script}"
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8000${script}"

      # How much memory the server needs, to size the cap on a small host: idle
      # with the demo plants, then at its peak after the largest label request.
      - name: Measure memory
        run: |
          token=ci-token-0123456789
          docker run --detach --name demo --publish 127.0.0.1:8001:8000 \
            --env SQUAREPOT_API_TOKEN="${token}" --env SQUAREPOT_STORE=file \
            --env SQUAREPOT_COLLECTIONS='[{"id": "demo", "name": "Demo plants", "file": "/demo/plants.csv"}]' \
            --volume "${PWD}/server/demo:/demo:ro" squarepot-server:ci
          api() { curl --fail --silent --show-error --header "Authorization: Bearer ${token}" "$@"; }
          for _ in $(seq 30); do
            ids="$(api http://127.0.0.1:8001/api/v1/sync 2>/dev/null \
              | jq --compact-output '[.plants[] | select(.tag != null) | .id]')" || true
            [ "${ids:-[]}" != "[]" ] && break
            sleep 1
          done
          [ "${ids:-[]}" != "[]" ] || { docker logs demo; exit 1; }
          idle="$(docker exec demo cat /sys/fs/cgroup/memory.current)"
          # The most plants a request may name: the demo plants over and over.
          body="$(jq --compact-output '{plants: [range(2000) as $i | .[$i % length]]}' <<<"${ids}")"
          api --request POST --header "Content-Type: application/json" --data "${body}" \
            --output labels.pdf http://127.0.0.1:8001/api/v1/labels
          peak="$(docker exec demo cat /sys/fs/cgroup/memory.peak)"
          {
            echo "### Server memory"
            echo "| idle | peak, 2000 labels as PDF | PDF size |"
            echo "| --- | --- | --- |"
            echo "| $((idle / 1048576)) MiB | $((peak / 1048576)) MiB | $(($(stat --format=%s labels.pdf) / 1048576)) MiB |"
          } | tee --append "${GITHUB_STEP_SUMMARY}"

      - name: Save the image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save squarepot-server:ci | gzip --fast > server-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: server-image
          path: server-image.tar.gz
          retention-days: 1

  # The image tested above goes to GHCR, tagged with the commit and "main", so
  # that a small host pulls it instead of building it. Only this job may write
  # packages, and it runs only on main.
  server-image-publish:
    name: Publish the server image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: server-image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/square-pot/squarepot-server
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip --stdout server-image.tar.gz | docker load
          echo "${TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          for tag in "${GITHUB_SHA}" main; do
            docker tag squarepot-server:ci "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          docker logout ghcr.io
