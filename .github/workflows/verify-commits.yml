# Temporary: builds every commit of the Android spike branch one by one (review of PR #4).
name: Verify commits

on:
  pull_request:
    paths:
      - ".github/workflows/verify-commits.yml"

permissions:
  contents: read

jobs:
  each-commit:
    name: Build each commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for c in $(git rev-list --reverse "$BASE"..HEAD~1); do
            git checkout -q "$c"
            subject=$(git log -1 --format='%h %s')
            if [ ! -x android/gradlew ]; then
              echo "SKIP  $subject (no Android project)"
              continue
            fi
            if (cd android && ./gradlew --no-daemon -q detekt ktlintCheck lintDebug testDebugUnitTest assembleDebug); then
              echo "PASS  $subject" | tee -a "$RUNNER_TEMP/summary.txt"
            else
              echo "FAIL  $subject" | tee -a "$RUNNER_TEMP/summary.txt"
              failed=1
            fi
          done
          echo "----"
          cat "$RUNNER_TEMP/summary.txt"
          exit "$failed"

      - name: Merged manifest of the last commit
        if: success() || failure()
        run: find android/app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml -exec cat {} \;
