name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include
        secrets, spreadsheet links or personal data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - Server
        - Web app
        - Telegram bot
        - Deployment
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or a commit hash
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs or screenshots if you have them.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device and Android version, browser, OS, Docker version, as relevant.
