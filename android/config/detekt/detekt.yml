# Overrides on top of detekt's default configuration (buildUponDefaultConfig).

naming:
  FunctionNaming:
    # Composable functions are PascalCase.
    ignoreAnnotated: ["Composable"]

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # Compose UI is full of dp, sp and alpha literals that read better inline.
    excludes: ["**/test/**", "**/*Screen.kt", "**/*Overlay.kt"]
  UnusedPrivateMember:
    # Compose previews are private and only used by the IDE.
    ignoreAnnotated: ["Preview"]

complexity:
  LongParameterList:
    ignoreAnnotated: ["Composable"]
