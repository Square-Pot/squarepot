<!-- A stylised 4x4 Data Matrix, per the approved mockup v3 (#189): three solid
     sides for the finder pattern, an alternating timing side, two blocks on the
     diagonal. One module in four device pixels at 16 px; inverted in dark mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 4">
  <style>
    .bg { fill: #fff; }
    .dm { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b15; }
      .dm { fill: #f2f3ee; }
    }
  </style>
  <rect class="bg" width="4" height="4"/>
  <g class="dm" shape-rendering="crispEdges">
    <rect x="0" y="0" width="1" height="1"/>
    <rect x="2" y="0" width="1" height="1"/>
    <rect x="0" y="1" width="2" height="1"/>
    <rect x="3" y="1" width="1" height="1"/>
    <rect x="0" y="2" width="1" height="1"/>
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="4" height="1"/>
  </g>
</svg>
