# Square-Pot, self-hosted. From this directory:
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
# On a small host, pull the image CI publishes instead of building it: set
# SQUAREPOT_IMAGE in .env, then `docker compose pull && docker compose up -d`.
# This reads sheets shared by link. For a private sheet read with a service
# account, add compose.google.yaml (see COMPOSE_FILE in .env.example).
name: squarepot

services:
  server:
    # The name a build is tagged with, or the published image to pull.
    image: ${SQUAREPOT_IMAGE:-squarepot-server:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    mem_limit: ${SQUAREPOT_MEMORY_LIMIT:-1g}
    env_file: .env
    volumes:
      - data:/data
    ports:
      - "${SQUAREPOT_LISTEN:-127.0.0.1:8000}:8000"
    restart: unless-stopped

volumes:
  data:
