[project]
name = "squarepot-server"
version = "0.1.0"
description = "Square-Pot API server: a cache, index and sync engine for plant collections kept in Google Sheets."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squarepot_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]
