# Alembic, for writing migrations: `uv run alembic revision --autogenerate -m "..."`.
# The server applies migrations itself at startup. The database URL comes from
# SQUAREPOT_DATABASE_URL, as for the server.
[alembic]
script_location = %(here)s/src/squarepot_server/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
